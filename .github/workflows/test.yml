name: test

on:
  push:
  pull_request:

jobs:
  hook:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Hook test
        run: sh tests/run-hook-test.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consistency check
        run: sh tests/check-consistency.sh
      - name: Shellcheck
        run: shellcheck hooks/check-stale tests/*.sh assets/src/render.sh
